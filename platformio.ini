; Builds the library's own example (examples/Basic) with PlatformIO — open the
; repo in VS Code + the PlatformIO extension, or run `pio run -e <env>`.
;
; Uses the community pioarduino platform, which tracks arduino-esp32 3.x on
; ESP-IDF 5.5. The official `espressif32` platform is stuck on arduino-esp32
; 2.x / IDF 4.4 and does not build this code.
;
; One env per chip/flash size; the partition table is fixed at build time and
; a table larger than the chip does not boot, so the default is the 4 MB one
; (every ESP32 module has at least 4 MB). ESP32-S3 modules are usually 8 or
; 16 MB, so the S3 env uses the 8 MB table. See doc/cy_thing_lib.md §4.
;
; Consumers of the library do not need this file; they add
;   lib_deps = https://github.com/mbahmani90/cylinko_firmware.git
; to their own project and copy the matching partitions/cything-<size>.csv.
[platformio]
src_dir = examples/Basic
default_envs = esp32-4mb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://.

[env:esp32-4mb]
board_build.partitions = partitions/cything-4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 1572864

[env:esp32-8mb]
board_build.partitions = partitions/cything-8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728

[env:esp32-16mb]
board_build.partitions = partitions/cything-16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304

; ESP32-S3 — compiles unchanged (no chip-specific code in src/); not yet
; verified on hardware. For a 16 MB module switch to cything-16MB.csv.
[env:esp32s3-8mb]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/cything-8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
