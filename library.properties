name=CyThing
version=1.0.1
author=Majid Bahmani
maintainer=Majid Bahmani
sentence=ESP32 smart-device firmware as a library: Wi-Fi pairing over BLE or soft-AP, TCP/UDP local control, AWS IoT MQTT with per-device certificate provisioning, HTTPS OTA.
paragraph=Include CyThingEsp32.h, call cything_begin() from setup(), and implement app_command_handle_line() (TCP) and app_mqtt_command_handle() (MQTT) to add your own commands. Copy a partitions/cything-<size>.csv into the sketch folder as partitions.csv. Tested on ESP32; compiles for ESP32-S3 and ESP32-C3.
category=Communication
url=https://github.com/mbahmani90/cything
architectures=esp32
includes=CyThingEsp32.h
depends=NimBLE-Arduino (>=2.5.1)
